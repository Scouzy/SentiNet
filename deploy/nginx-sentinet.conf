# ─────────────────────────────────────────────────────────────────────────────
#  SentiNet — reverse proxy nginx
#  Sert le frontend (build Vite statique) + proxifie l'API et le WebSocket.
#  À placer dans : /etc/nginx/sites-available/sentinet.devantiq.com
#  Puis : ln -s vers /etc/nginx/sites-enabled/  ·  nginx -t  ·  systemctl reload nginx
#  HTTPS : certbot --nginx complètera automatiquement le bloc 443.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name sentinet.devantiq.com;

    # Frontend — build de production Vite
    root /var/www/sentinet/sentinet-app/dist;
    index index.html;

    # Taille max des requêtes (import de règles, IoC, etc.)
    client_max_body_size 5m;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA — toutes les routes non-fichiers retombent sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets statiques — cache long (fichiers hashés par Vite)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API REST → backend Node
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # WebSocket temps réel → backend Node
    location /ws {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;   # garde la connexion WS ouverte (métriques 3 s)
    }
}
